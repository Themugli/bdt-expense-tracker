kind = "web"
previewPath = "/"
title = "Expense Tracker"
description = "A mobile-friendly personal expense tracker for logging daily spending in Bangladeshi taka, monitoring a ৳7,000 monthly allowance and category budgets, reviewing charts and transaction history, and exporting monthly CSV summaries. Data persists locally in the browser."
version = "1.0.0"
id = "artifacts/expense-tracker"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25762

[services.development]
run = "pnpm --filter @workspace/expense-tracker run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/expense-tracker", "run", "build" ]
serve = "static"
publicDir = "artifacts/expense-tracker/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25762"
BASE_PATH = "/"
